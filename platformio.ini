[env:heltec_wireless_paper]
platform = espressif32@^6.7.0
board = heltec_wireless_paper
framework = arduino
monitor_speed = 115200
lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library@^6.0.0
    todd-herbert/heltec-eink-modules@^1.0.0
build_flags =
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D CFG_eu868=1
    -D CFG_sx1262_radio=1
    -D LMIC_USE_INTERRUPTS
