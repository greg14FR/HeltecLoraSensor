[env:heltec_wireless_paper]
; La carte heltec_wireless_paper n'existe que dans platform-espressif32 v8.0.0+
; (Arduino core 3.x). Sur espressif32 6.x/7.x, utiliser a la place :
;   board = esp32-s3-devkitc-1   (la pinmap SX1262 est definie dans main.cpp)
platform = espressif32@^8.0.0
board = heltec_wireless_paper
framework = arduino
monitor_speed = 115200
; heltec-eink-modules : la classe EInkDisplay_WirelessPaperV1_2 (Wireless Paper V1.2,
; panneau E0213A367) n'existe que depuis le tag v4.6.0 sur GitHub (le registre n'a que 4.5.0)
lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library@^6.0.1
    https://github.com/todd-herbert/heltec-eink-modules.git#v4.6.0
build_flags =
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D CFG_eu868=1
    -D CFG_sx1262_radio=1
    -D LMIC_USE_INTERRUPTS
    -D ARDUINO_USB_CDC_ON_BOOT=1
