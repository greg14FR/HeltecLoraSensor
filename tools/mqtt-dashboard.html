<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dashboard LoRaWAN - uplinks MQTT (via pont local)</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 2em; background:#111; color:#eee; }
  input { margin: 4px; padding: 6px; }
  #log { background:#000; color:#0f0; padding:1em; height:300px; overflow:auto;
         font-family:monospace; white-space:pre-wrap; }
  .row { margin: 4px 0; }
  button { padding: 6px 14px; }
  .ok { color:#0f0; } .err { color:#f66; }
</style>
</head>
<body>
<h2>Dashboard LoRaWAN — uplinks MQTT</h2>
<p>Se connecte au pont local (voir <code>tools/ttn-ws-bridge.js</code>) qui lui-même lit TTN.</p>
<div class="row">
  Broker WebSocket : <input id="broker" value="ws://localhost:9001" size="28">
  Topic : <input id="topic" value="lorawan/up" size="16">
  <button onclick="connect()">Connexion</button>
  <span id="status" class="err">déconnecté</span>
</div>
<div id="log"></div>

<script>
const log = document.getElementById('log');
function print(msg, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
let client = null;
function connect() {
  const url = document.getElementById('broker').value.trim();
  const topic = document.getElementById('topic').value.trim();
  if (client) client.end();
  print('Connexion à ' + url + ' ...');
  client = mqtt.connect(url);
  client.on('connect', () => {
    document.getElementById('status').textContent = 'connecté';
    document.getElementById('status').className = 'ok';
    client.subscribe(topic, (err) => print(err ? 'Erreur subscribe: ' + err : 'Abonné à ' + topic, err ? 'err' : 'ok'));
  });
  client.on('message', (t, payload) => {
    try {
      const j = JSON.parse(payload.toString());
      const up = j.uplink_message || {};
      const dev = (j.end_device_ids && j.end_device_ids.dev_eui) || '?';
      print('UP ' + dev + '  fPort=' + up.f_port +
            '  RSSI=' + (up.rx_metadata && up.rx_metadata[0] ? up.rx_metadata[0].rssi : '?') +
            '  data=' + JSON.stringify(up.decoded_payload || up.frm_payload));
    } catch (e) { print('MSG brut: ' + payload.toString()); }
  });
  client.on('error', (e) => print('Erreur: ' + e.message, 'err'));
  client.on('close', () => {
    document.getElementById('status').textContent = 'déconnecté';
    document.getElementById('status').className = 'err';
  });
}
</script>
</body>
</html>
