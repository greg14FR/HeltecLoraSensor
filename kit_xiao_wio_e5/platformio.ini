; Restauration du noeud d'origine du kit SenseCAP (XIAO ESP32S3 + Grove Wio-E5)
[env:seeed_xiao_esp32s3]
platform = espressif32@^6.7.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter

; Environnement temporaire : pont AT entre le PC et le Wio-E5
; (permet de taper AT+ID, AT+DR, AT+JOIN... a la main dans le moniteur serie)
[env:seeed_xiao_esp32s3_at]
platform = espressif32@^6.7.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
src_dir = at_passthrough
